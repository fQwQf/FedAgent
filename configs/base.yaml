# FedRNK Base Configuration
# All experiments inherit from this file.

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  dtype: "bfloat16"
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    # Attention modules
    attn_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    # MLP modules
    mlp_modules: ["gate_proj", "up_proj", "down_proj"]
    # By default, apply LoRA to both
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                      "gate_proj", "up_proj", "down_proj"]

training:
  num_rounds: 20
  local_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  max_seq_length: 2048
  seed: 42
  fp16: false
  bf16: true

federation:
  num_clients: 5
  method: "feddebias"
  client_selection: 1.0
  success_rates:
    babyai: 0.83
    webshop: 0.73
    textcraft: 0.67
    maze: 0.28
    wordle: 0.05

logging:
  experiment_name: "default"
  log_dir: "outputs"
  use_wandb: false
  wandb_project: "fedrnk"
  log_gradients: false     # Enable for E0 experiments
  log_interval: 1
  save_checkpoint_every: 5
  console_log_level: "INFO"
